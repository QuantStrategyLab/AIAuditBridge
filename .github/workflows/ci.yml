name: QuantAIService V2 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test the independent task service
        run: |
          python -m pip install setuptools wheel ruff==0.15.22
          python -m ruff check src tests/task_service tests/test_quant_service_v2.py scripts/verify_release_install.py
          python -m compileall -q src
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          python -m pip install dist/*.whl
          python -m pip check
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -I scripts/verify_release_install.py --version "$version"
          python -m unittest discover -s tests/task_service -v
          python -m unittest discover -s tests -p test_quant_service_v2.py -v
      - name: Validate monitor tests with explicit optional-dependency skips
        env:
          PYTHONPATH: ops/quant-monitor
        run: python -m unittest discover -s tests -v
      - name: Validate daily release adoption without cloud access
        run: |
          python -m pip install pytest
          bash -n ops/quant-monitor/scripts/adopt_daily_briefing_release.sh
          python -m pytest -q ops/quant-monitor/tests/test_adopt_daily_briefing_release.py ops/quant-monitor/tests/test_install_immutable_release.py ops/quant-monitor/tests/test_runtime_daily_pipeline.py
          python -m pytest -q ops/quant-monitor/tests/test_q04_synthetic_caller.py ops/quant-monitor/tests/test_monitor_fail_closed.py::MonitorFailClosedTests::test_historical_rehearsal_requires_explicit_synthetic_context
      - name: Test Quant deployment controls without VPS access
        run: |
          python -m ruff check deploy/vps/ci-deploy tests/test_vps_deploy.py
          python -m unittest discover -s tests -p test_vps_deploy.py -v
      - name: Build reviewable Linux bundle without deploying
        run: |
          mkdir -p release/wheels
          python -m pip download --only-binary=:all: \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 \
            --implementation cp --python-version 3.12 --dest release/wheels dist/*.whl
          python deploy/vps/ci-deploy/ci_release.py build --root release --out quant-vps-bundle \
            --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID$GITHUB_RUN_ATTEMPT"
      - name: Smoke test the exact hash-pinned Linux bundle offline
        run: |
          python -m venv "$RUNNER_TEMP/quant-bundle-smoke"
          "$RUNNER_TEMP/quant-bundle-smoke/bin/python" -I -m pip --isolated install \
            --no-index --no-deps --only-binary=:all: --require-hashes --no-cache-dir \
            --find-links release/wheels -r release/requirements.txt
          "$RUNNER_TEMP/quant-bundle-smoke/bin/python" -I -m pip --isolated check
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          "$RUNNER_TEMP/quant-bundle-smoke/bin/python" -I scripts/verify_release_install.py --version "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quant-vps-bundle
          path: quant-vps-bundle/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: quant-ai-service-v2-unpublished
          path: dist/*.whl
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
