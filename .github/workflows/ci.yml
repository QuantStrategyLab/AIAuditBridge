name: QuantAIService V2 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test the independent task service
        run: |
          python -m pip install setuptools wheel ruff==0.15.22
          python -m ruff check src tests/test_quant_service_v2.py
          python -m compileall -q src
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          python -m pip install dist/*.whl
          python -m pip check
          python -m unittest discover -s tests/task_service -v
          python -m unittest discover -s tests -p test_quant_service_v2.py -v
      - name: Validate monitor tests with explicit optional-dependency skips
        env:
          PYTHONPATH: ops/quant-monitor
        run: python -m unittest discover -s tests -v
      - name: Validate daily release adoption without cloud access
        run: |
          python -m pip install pytest
          bash -n ops/quant-monitor/scripts/adopt_daily_briefing_release.sh
          python -m pytest -q ops/quant-monitor/tests/test_adopt_daily_briefing_release.py ops/quant-monitor/tests/test_install_immutable_release.py ops/quant-monitor/tests/test_runtime_daily_pipeline.py
      - uses: actions/upload-artifact@v7
        with:
          name: quant-ai-service-v2-unpublished
          path: dist/*.whl
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
