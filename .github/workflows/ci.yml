name: QuantAIService V2 CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate and build the Quant wrapper
        run: |
          python -m pip install setuptools wheel ruff==0.15.22
          python -m ruff check src tests/test_quant_service_v2.py
          python -m compileall -q src
          python -m pip wheel --no-deps --no-build-isolation . -w dist
      - uses: actions/upload-artifact@v7
        with:
          name: quant-ai-service-v2-unpublished
          path: dist/*.whl
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
  admitted-service:
    if: vars.AI_SERVICE_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require approved shared source revision
        env:
          APPROVED_SHARED_SHA: ${{ vars.AI_SERVICE_SHARED_SOURCE_SHA }}
          APPROVED_QPK_SHA: ${{ vars.AI_SERVICE_QPK_SOURCE_SHA }}
        run: python -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}", os.environ["APPROVED_SHARED_SHA"]); assert re.fullmatch("[0-9a-f]{40}", os.environ["APPROVED_QPK_SHA"])'
      - uses: actions/checkout@v6
        with:
          repository: Pigbibi/AIGateway
          ref: ${{ vars.AI_SERVICE_SHARED_SOURCE_SHA }}
          path: shared-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: QuantStrategyLab/QuantPlatformKit
          ref: ${{ vars.AI_SERVICE_QPK_SOURCE_SHA }}
          path: qpk-source
          persist-credentials: false
      - name: Validate admitted identities with approved shared service
        run: |
          python -m pip install pytest pandas ./shared-source ./qpk-source .
          python -m pip check
          PYTHONPATH=ops/quant-monitor python -m pytest -q tests ops/quant-monitor/tests/test_monitor_fail_closed.py
