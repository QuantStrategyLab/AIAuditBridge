name: Cloud job migration CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate infrastructure without credentials or backend
        run: |
          terraform -chdir=deploy/cloud-jobs fmt -check
          terraform -chdir=deploy/cloud-jobs init -backend=false -input=false -lockfile=readonly
          terraform -chdir=deploy/cloud-jobs validate
      - name: Build isolated notification/monitor image without publishing
        run: docker build --build-arg PYTHON_IMAGE=python:3.12-slim -f deploy/cloud-jobs/Dockerfile -t cloud-job-ci .
      - name: Verify container entry without cloud access
        run: docker run --rm --network=none cloud-job-ci --help
