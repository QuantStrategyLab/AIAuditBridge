name: Codex Audit

on:
  schedule:
    # Summarize the VPS report after its 22:30 UTC timer. No optimization job.
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      daily_summary:
        description: "Summarize existing VPS daily reports only (requires AI_DAILY_SUMMARY_ENABLED)"
        required: false
        type: boolean
        default: false
      synthetic_sdk_check:
        description: "Run one synthetic subscription SDK check instead of the monthly audit"
        required: false
        type: boolean
        default: false
      synthetic_check_kind:
        description: "Fixed test to run only when synthetic_sdk_check is enabled"
        required: false
        type: choice
        default: consumer
        options:
          - consumer
          - financial_samples
          - consumer_samples
      source_repo:
        description: "Repository that owns the monthly review issue"
        required: true
        default: "QuantStrategyLab/CryptoLivePoolPipelines"
      issue_number:
        description: "Monthly review issue number in source_repo (required for monthly audit)"
        required: false
      source_ref:
        description: "Source repository branch to audit"
        required: false
        default: "main"
      mode:
        description: "Run mode"
        required: false
        type: choice
        default: "review_and_fix"
        options:
          - review_only
          - review_and_fix
      provider:
        description: "Audit provider"
        required: false
        type: choice
        default: "task_default"
        options:
          - task_default
          - auto
          - api
          - anthropic
          - codex
          - openai
      task:
        description: "Codex bridge task"
        required: false
        type: choice
        default: "monthly_snapshot_audit"
        options:
          - monthly_snapshot_audit
          - long_horizon_signal_shadow
      auto_merge:
        description: "Request guarded source-repository auto-merge for generated PRs"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types:
      - monthly-review-created

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.daily_summary) && 'codex-audit-daily-summary' || inputs.synthetic_sdk_check && 'codex-audit-synthetic-sdk' || format('codex-audit-{0}-{1}', github.event.client_payload.source_repo || inputs.source_repo, github.event.client_payload.issue_number || inputs.issue_number) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && inputs.daily_summary != true && inputs.synthetic_sdk_check != true }}

jobs:
  codex-audit:
    if: github.event_name != 'schedule' && inputs.daily_summary != true && inputs.synthetic_sdk_check != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SOURCE_REPO: ${{ github.event.client_payload.source_repo || inputs.source_repo || 'QuantStrategyLab/CryptoLivePoolPipelines' }}
      ISSUE_NUMBER: ${{ github.event.client_payload.issue_number || inputs.issue_number }}
      SOURCE_REF: ${{ github.event.client_payload.source_ref || inputs.source_ref || 'main' }}
      CODEX_AUDIT_MODE: ${{ github.event.client_payload.mode || inputs.mode || 'review_and_fix' }}
      CODEX_AUDIT_PROVIDER: ${{ github.event.client_payload.provider || inputs.provider || 'task_default' }}
      CODEX_AUDIT_CODEX_BACKEND: service
      CODEX_AUDIT_TASK: ${{ github.event.client_payload.task || inputs.task || 'monthly_snapshot_audit' }}
      CODEX_AUDIT_AUTO_MERGE: ${{ github.event.client_payload.auto_merge || inputs.auto_merge || 'false' }}
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@v6.0.3

      - name: Detect GitHub App Credentials
        id: app_credentials
        env:
          APP_ID: ${{ vars.CROSS_REPO_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_REPO_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Source Repository Name
        id: source_repo
        run: |
          set -euo pipefail
          repository="${SOURCE_REPO#*/}"
          if [ -z "${repository}" ] || [ "${repository}" = "${SOURCE_REPO}" ]; then
            echo "Invalid SOURCE_REPO: ${SOURCE_REPO}" >&2
            exit 1
          fi
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App Token For Source Repository
        id: source_app_token
        if: steps.app_credentials.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.CROSS_REPO_GITHUB_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.source_repo.outputs.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Run Codex Audit
        env:
          CODEX_AUDIT_GH_TOKEN: ${{ steps.source_app_token.outputs.token || secrets.CODEX_AUDIT_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          CODEX_AUDIT_API_FALLBACK_ALLOWED_SOURCE_REPOSITORIES: ${{ vars.CODEX_AUDIT_API_FALLBACK_ALLOWED_SOURCE_REPOSITORIES }}
          CODEX_AUDIT_API_FALLBACK_ALLOW_FIX: ${{ vars.CODEX_AUDIT_API_FALLBACK_ALLOW_FIX || 'true' }}
          CODEX_AUDIT_API_FALLBACK_PROVIDER_ORDER: ${{ vars.CODEX_AUDIT_API_FALLBACK_PROVIDER_ORDER || 'openai,anthropic' }}
          CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
          CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
        run: python scripts/run_monthly_codex_audit.py

  synthetic-sdk-check:
    if: github.event_name == 'workflow_dispatch' && inputs.synthetic_sdk_check == true && inputs.daily_summary != true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned synthetic-test consumer
        run: >-
          python -m pip install
          'quant-strategy-plugins[ai] @ git+https://github.com/QuantStrategyLab/QuantStrategyPlugins.git@6b76d512c8273deb804c0770a203558284778399'
      - name: Verify one subscription request and advisory consumption
        env:
          SYNTHETIC_CHECK_KIND: ${{ inputs.synthetic_check_kind || 'consumer' }}
          CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
          CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
          AI_GATEWAY_SOURCE_REPO: QuantStrategyLab/AIAuditBridge
        run: |
          set -euo pipefail
          python scripts/verify_subscription_ai_consumer.py | tee ai-subscription-check.json
      - name: Retain sanitized check result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-subscription-check
          path: ai-subscription-check.json
          if-no-files-found: error
          retention-days: 7

  daily-summary:
    if: >-
      github.ref == 'refs/heads/main' && vars.AI_DAILY_SUMMARY_ENABLED == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.daily_summary == true))
    runs-on:
      - self-hosted
      - codex-vps
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout approved Bridge revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Summarize existing VPS reports with this job's OIDC identity
        env:
          CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
          CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
          AI_GATEWAY_SOURCE_REPO: QuantStrategyLab/AIAuditBridge
          AI_GATEWAY_RESEARCH_PROVIDERS: codex
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          # Use the latest 22:30 UTC report slot, including runs delayed past midnight.
          # Missing/invalid reports still fail in the existing consumer; no older fallback.
          report_day="$(python3 -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(hours=22, minutes=30)).date())')"
          report_root=/home/ubuntu/quant-monitor-runtime/AIAuditBridge/ops/quant-monitor/data/daily-reports
          python3 -m scripts.consume_daily_briefing \
            --report-dir "$report_root/$report_day" --day "$report_day" \
            --summary-only > daily-ai-summary.json
      - name: Retain advisory summary only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-ai-summary
          path: daily-ai-summary.json
          if-no-files-found: error
          retention-days: 7
