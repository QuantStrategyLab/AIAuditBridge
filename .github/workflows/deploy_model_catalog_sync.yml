name: Deploy Model Catalog Sync

# Fully automatic VPS install for monthly model-catalog sync.
# Uses repo secrets OPENAI_API_KEY / ANTHROPIC_API_KEY — no manual SSH.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - inspect
          - sync-now
  push:
    branches: [main]
    paths:
      - "ops/codex-audit/**"
      - "scripts/sync_model_catalog.py"
      - "service/model_catalog.py"
      - "service/model_catalog_sync.py"
      - "service/model_resolver.py"
      - "generated/model_catalog.json"
      - ".github/workflows/deploy_model_catalog_sync.yml"

permissions:
  contents: read

concurrency:
  group: deploy-model-catalog-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - codex-vps
    timeout-minutes: 15
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Deploy model catalog sync
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIAUDIT_BRIDGE_ROOT: ${{ github.workspace }}
          MODEL_CATALOG_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mode="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}"
          # Install committed code from this exact workflow checkout. The
          # long-lived developer checkout and its local documents are untouched.
          bash "$AIAUDIT_BRIDGE_ROOT/ops/codex-audit/scripts/deploy_model_catalog_sync.sh" "$mode"
