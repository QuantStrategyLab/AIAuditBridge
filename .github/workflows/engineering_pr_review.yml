name: Engineering PR Review

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open AIAuditBridge PR targeting main"
        required: true
        type: number
      ci_run_id:
        description: "Successful latest-attempt CI run for the exact PR head"
        required: true
        type: number

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: engineering-pr-review-${{ inputs.pull_request_number }}-${{ inputs.ci_run_id }}
  cancel-in-progress: false

jobs:
  engineering-pr-review:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'QuantStrategyLab/AIAuditBridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      SOURCE_REPO: QuantStrategyLab/AIAuditBridge
      CODEX_AUDIT_MODE: review_only
      CODEX_AUDIT_AUTO_MERGE: "false"
      CODEX_AUDIT_ENGINEERING_PR_REVIEW_ENABLED: "true"
    steps:
      - name: Checkout the exact signed workflow revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Select the supported Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run one evidence-bound review
        env:
          CODEX_AUDIT_GH_TOKEN: ${{ github.token }}
          CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
          CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
        run: >-
          python3 scripts/run_monthly_codex_audit.py
          --operation engineering_pr_review
          --pull-request-number "${{ inputs.pull_request_number }}"
          --ci-run-id "${{ inputs.ci_run_id }}"
