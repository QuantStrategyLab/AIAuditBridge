name: Global ETF Candidate Review

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Review the fixed volatility candidate; no edits
        required: true
        default: false
        type: boolean
      auth_only:
        description: Check the audit-service authentication path only; no research work
        required: true
        default: false
        type: boolean
      resume_deferred:
        description: Resume one due, pre-execution Codex quota deferral
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: global-etf-research-codegen
  cancel-in-progress: false

jobs:
  codegen:
    if: github.repository == 'QuantStrategyLab/AIAuditBridge' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: [self-hosted, codex-vps]
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CASE_ROOT: ${{ github.workspace }}/.aab-global-etf-codegen
      CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
      CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
      AI_GATEWAY_SOURCE_REPO: QuantStrategyLab/AIAuditBridge
      AI_GATEWAY_RESEARCH_PROVIDERS: codex
    steps:
      - name: Checkout AIAuditBridge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Reject conflicting execution modes
        run: |
          set -euo pipefail
          if [ "${{ inputs.execute }}" = "true" ] && [ "${{ inputs.auth_only }}" = "true" ]; then
            echo "execute_and_auth_only_are_mutually_exclusive" >&2
            exit 2
          fi
          if [ "${{ inputs.resume_deferred }}" = "true" ] && [ "${{ inputs.execute }}" != "true" ]; then
            echo "resume_deferred_requires_execute" >&2
            exit 2
          fi
          if [ "${{ inputs.resume_deferred }}" = "true" ] && [ "${{ inputs.auth_only }}" = "true" ]; then
            echo "resume_deferred_and_auth_only_are_mutually_exclusive" >&2
            exit 2
          fi

      - name: Checkout frozen UsEquityStrategies base
        if: inputs.execute == true || inputs.auth_only == true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: QuantStrategyLab/UsEquityStrategies
          ref: ceb3e6eb33c7913bcc10bacd6a04fda8aeb1c7ff
          path: ues-source
          persist-credentials: false

      - name: Initialize the bounded execute workspace
        if: inputs.execute == true || inputs.auth_only == true
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$CASE_ROOT"

      - name: Check Docker before any bounded source or model call
        if: inputs.execute == true
        run: docker info --format '{{.ServerVersion}}'

      - name: Install the bounded codegen runtime
        if: inputs.execute == true || inputs.auth_only == true
        run: |
          set -euo pipefail
          umask 077
          rm -rf -- "$CASE_ROOT"
          mkdir -m 700 "$CASE_ROOT"
          python3 -m venv "$CASE_ROOT/tools"
          "$CASE_ROOT/tools/bin/python" -m pip install --quiet 'uv==0.11.19'
          cd ues-source
          UV_PROJECT_ENVIRONMENT="$CASE_ROOT/ues-env" env -u UV_PYTHON -u VIRTUAL_ENV \
            "$CASE_ROOT/tools/bin/uv" sync --locked --no-dev --no-editable --python 3.11
          cd ..
          "$CASE_ROOT/tools/bin/uv" venv --python 3.11 --seed "$CASE_ROOT/venv"
          "$CASE_ROOT/venv/bin/python" -m pip install --quiet \
            "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@de13e486da1bdba60f425e576e944591fc97b809" \
            ./ues-source ./

      - name: Verify audit-service authentication before research entry
        if: inputs.execute == true || inputs.auth_only == true
        run: |
          "$CASE_ROOT/venv/bin/python" -m scripts.run_global_etf_research_codegen --auth-preflight

      - name: Run the fixed plan or execute path
        if: inputs.auth_only != true
        run: |
          set -euo pipefail
          if [ "${{ inputs.execute }}" = "true" ]; then
            resume_arg=()
            if [ "${{ inputs.resume_deferred }}" = "true" ]; then
              resume_arg+=(--resume-deferred)
            fi
            "$CASE_ROOT/venv/bin/python" -m scripts.run_global_etf_research_codegen --execute --ues-repo-root "$GITHUB_WORKSPACE/ues-source" "${resume_arg[@]}"
          else
            python3 -m scripts.run_global_etf_research_codegen
          fi

      - name: Project the bounded advisory result
        if: always() && inputs.execute == true
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$CASE_ROOT/artifact"
          chmod 700 "$CASE_ROOT/artifact"
          python3 -m scripts.run_global_etf_research_codegen --project-result > "$CASE_ROOT/artifact/result.json"

      - name: Upload only the bounded advisory result
        if: always() && inputs.execute == true
        uses: actions/upload-artifact@v7
        with:
          name: global-etf-research-codegen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CASE_ROOT }}/artifact/result.json
          if-no-files-found: warn
          retention-days: 7
