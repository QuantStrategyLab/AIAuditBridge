name: Global ETF Research Codegen

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Run the fixed review-only codegen case
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: global-etf-research-codegen
  cancel-in-progress: false

jobs:
  codegen:
    if: github.repository == 'QuantStrategyLab/AIAuditBridge' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: [self-hosted, codex-vps]
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CASE_ROOT: ${{ github.workspace }}/.aab-global-etf-codegen
      CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
      CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
      AI_GATEWAY_SOURCE_REPO: QuantStrategyLab/AIAuditBridge
      AI_GATEWAY_RESEARCH_PROVIDERS: codex
    steps:
      - name: Checkout AIAuditBridge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Checkout frozen UsEquityStrategies base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: QuantStrategyLab/UsEquityStrategies
          ref: 5f11fcfe8c5473de20e1b590e9aa3e87665b6108
          path: ues-source
          persist-credentials: false

      - name: Initialize the bounded execute workspace
        if: inputs.execute == true
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$CASE_ROOT"

      - name: Check Docker before any bounded source or model call
        if: inputs.execute == true
        run: docker info --format '{{.ServerVersion}}'

      - name: Install the bounded codegen runtime
        if: inputs.execute == true
        run: |
          set -euo pipefail
          umask 077
          rm -rf -- "$CASE_ROOT"
          mkdir -m 700 "$CASE_ROOT"
          python3 -m venv "$CASE_ROOT/tools"
          "$CASE_ROOT/tools/bin/python" -m pip install --quiet 'uv==0.11.19'
          cd ues-source
          UV_PROJECT_ENVIRONMENT="$CASE_ROOT/ues-env" env -u UV_PYTHON -u VIRTUAL_ENV \
            "$CASE_ROOT/tools/bin/uv" sync --locked --no-dev --no-editable --python 3.11
          cd ..
          "$CASE_ROOT/tools/bin/uv" venv --python 3.11 --seed "$CASE_ROOT/venv"
          "$CASE_ROOT/venv/bin/python" -m pip install --quiet \
            "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@de13e486da1bdba60f425e576e944591fc97b809" \
            ./ues-source ./

      - name: Run the fixed plan or execute path
        run: |
          set -euo pipefail
          if [ "${{ inputs.execute }}" = "true" ]; then
            "$CASE_ROOT/venv/bin/python" -m scripts.run_global_etf_research_codegen --execute --ues-repo-root "$GITHUB_WORKSPACE/ues-source"
          else
            python3 -m scripts.run_global_etf_research_codegen
          fi

      - name: Project the bounded result and candidate for artifact review
        if: always() && inputs.execute == true
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$CASE_ROOT/artifact"
          chmod 700 "$CASE_ROOT/artifact"
          python3 - "$HOME/.local/state/aiauditbridge/global-etf-codegen-20260916/result.json" "$CASE_ROOT/artifact/result.json" <<'PY'
          import json, sys
          from pathlib import Path
          source, target = map(Path, sys.argv[1:])
          if source.is_file():
              value = json.loads(source.read_text(encoding="utf-8"))
              value.pop("source", None)
              target.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True), encoding="utf-8")
          PY
          if [ "$(python3 -c 'import json,sys; p=sys.argv[1]; print(json.load(open(p)).get("status", ""))' "$CASE_ROOT/artifact/result.json" 2>/dev/null || true)" = "patch_validated" ]; then
            tar -czf "$CASE_ROOT/artifact/candidate-source.tar.gz" -C "$HOME/.local/state/aiauditbridge/global-etf-codegen-20260916" candidate
          fi

      - name: Upload only the bounded result and verified candidate
        if: always() && inputs.execute == true
        uses: actions/upload-artifact@v7
        with:
          name: global-etf-research-codegen-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CASE_ROOT }}/artifact/result.json
            ${{ env.CASE_ROOT }}/artifact/candidate-source.tar.gz
          if-no-files-found: warn
          retention-days: 7
