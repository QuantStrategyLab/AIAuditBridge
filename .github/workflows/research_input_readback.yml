name: VPS Research Input Readback

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bounded operation to perform
        required: true
        default: readback
        type: choice
        options:
          - readback
          - soxl_learning
          - soxl_validation
      blend_gate_mid_soxl_weights:
        description: Reviewed baseline and up to two bounded learning values
        required: true
        default: '0.65,0.60,0.55'
        type: string

permissions:
  contents: read

concurrency:
  group: vps-research-input-readback
  cancel-in-progress: false

jobs:
  readback:
    if: github.repository == 'QuantStrategyLab/AIAuditBridge' && github.ref == 'refs/heads/main' && (inputs.operation == 'readback' || github.run_attempt == 1)
    runs-on: [self-hosted, codex-vps]
    timeout-minutes: ${{ inputs.operation != 'readback' && 35 || 10 }}
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set bounded validation temporary paths
        env:
          VALIDATION_CONTROL_ENV: ${{ runner.temp }}/aab-soxl-validation-control-${{ github.run_id }}-${{ github.run_attempt }}
          DEVELOPMENT_SOURCE_ROOT: ${{ runner.temp }}/aab-soxl-validation-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf 'VALIDATION_CONTROL_ENV=%s\nDEVELOPMENT_SOURCE_ROOT=%s\n' "$VALIDATION_CONTROL_ENV" "$DEVELOPMENT_SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Initialize the sanitized research record
        if: inputs.operation != 'readback'
        env:
          LEARNING_OUTPUT: ${{ runner.temp }}/aab-soxl-learning-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$(dirname "$LEARNING_OUTPUT")"
          python3 -c 'import os; from pathlib import Path; from scripts.run_soxl_manual_learning import initialize_record; initialize_record(Path(os.environ["LEARNING_OUTPUT"]), {"repository": os.environ["GITHUB_REPOSITORY"], "ref": os.environ["GITHUB_REF"], "event_name": os.environ["GITHUB_EVENT_NAME"], "actor": os.environ["GITHUB_ACTOR"], "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"]}, operation=os.environ["OPERATION"])'

      - name: Checkout the frozen original P1 validator
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: QuantStrategyLab/UsEquitySnapshotPipelines
          ref: ca61b82c2a508a1cc81fb5831294ba9835ac41c2
          path: validator-source
          persist-credentials: false

      - name: Checkout the bounded learning consumer
        if: inputs.operation != 'readback'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: QuantStrategyLab/UsEquitySnapshotPipelines
          ref: ${{ inputs.operation == 'soxl_validation' && 'b68b4a81ccdab7b61042fcf98df0189dfe539ef4' || 'b03ecbe4e0a7a0de22f298499f867a7039e4b60a' }}
          path: consumer-source
          persist-credentials: false

      - name: Checkout the frozen strategy runtime
        if: inputs.operation != 'readback'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: QuantStrategyLab/UsEquityStrategies
          ref: 7756fe32585e85cf1d09a163203a02e3eee39fe1
          path: ues-source
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.2.0
        with:
          python-version: '3.11'

      # Match the source workflow's locked environment before minting the
      # short-lived cloud credential, so installation cannot consume its life.
      - name: Install the frozen validator runtime
        working-directory: validator-source
        run: |
          python -m pip install --quiet 'uv==0.11.19'
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11

      - name: Install the bounded learning consumer runtime
        if: inputs.operation != 'readback'
        working-directory: consumer-source
        run: env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11

      - name: Install the frozen strategy runtime
        if: inputs.operation != 'readback'
        working-directory: ues-source
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/aab-soxl-ues-env-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
          rm -rf -- build
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Checkout the published strict gate
        if: inputs.operation == 'soxl_validation'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: QuantStrategyLab/QuantPlatformKit
          ref: 7363011d56926d39f4fffeb036e511391114e39f
          path: validation-gate-source
          persist-credentials: false

      - name: Install the isolated strict gate
        if: inputs.operation == 'soxl_validation'
        run: |
          set -euo pipefail
          python3 -m venv "$VALIDATION_CONTROL_ENV"
          "$VALIDATION_CONTROL_ENV/bin/python" -m pip install --quiet --no-deps ./validation-gate-source
          "$VALIDATION_CONTROL_ENV/bin/python" -c 'from quant_platform_kit.strategy_lifecycle.research_promotion_cycle import enforce_promotion_backtest_gates; from scripts.run_soxl_manual_learning import run_manual_validation'

      - name: Read the original completed development summary
        if: inputs.operation == 'soxl_validation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$DEVELOPMENT_SOURCE_ROOT"
          if ! gh run download 34376283866 --repo QuantStrategyLab/AIAuditBridge --name soxl-manual-learning-34376283866-1 --dir "$DEVELOPMENT_SOURCE_ROOT" > "$DEVELOPMENT_SOURCE_ROOT/download.log" 2>&1; then
            echo '{"status":"parked","failure_stage":"development_summary_unavailable"}'
            exit 1
          fi
          DEVELOPMENT_SUMMARY="$DEVELOPMENT_SOURCE_ROOT/summary.json" "$VALIDATION_CONTROL_ENV/bin/python" -c 'import json, os; from pathlib import Path; from scripts.run_soxl_manual_learning import _summary_digest, DEVELOPMENT_SUMMARY_SHA256; p=Path(os.environ["DEVELOPMENT_SUMMARY"]); assert not p.is_symlink() and p.stat().st_size <= 1048576; assert _summary_digest(json.loads(p.read_text())) == DEVELOPMENT_SUMMARY_SHA256'

      # Direct federation grants only object reads on the fixed P1 root below.
      # The provider additionally binds numeric repo/owner IDs, main and this workflow.
      # No service-account key, user ADC, daemon credential or AI invocation is used.
      - name: Authenticate for this research input only
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: interactivebrokersquant
          workload_identity_provider: projects/303168642265/locations/global/workloadIdentityPools/github-actions/providers/aab-research-input
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Read and verify the completed immutable P1 root
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
          CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: 'true'
          INPUT_ROOT: gs://qsl-runtime-logs-shared/soxl-p1-p3/06ce97ad581fdc465896ef324ce16ac65f2695af95ec18ce27238bdd71032f74/
          EXPECTED_MANIFEST_SHA256: 06ce97ad581fdc465896ef324ce16ac65f2695af95ec18ce27238bdd71032f74
          READBACK_ROOT: ${{ runner.temp }}/aab-research-input-${{ github.run_id }}-${{ github.run_attempt }}
          VALIDATOR_SOURCE: ${{ github.workspace }}/validator-source
          OPERATION: ${{ inputs.operation }}
          PARAMETER_GRID: ${{ inputs.blend_gate_mid_soxl_weights }}
          CONSUMER_SOURCE: ${{ github.workspace }}/consumer-source
          UES_SOURCE: ${{ github.workspace }}/ues-source
          LEARNING_OUTPUT: ${{ runner.temp }}/aab-soxl-learning-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
          CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
          UES_ENV_ROOT: ${{ runner.temp }}/aab-soxl-ues-env-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cleanup() {
            rm -rf -- "$READBACK_ROOT"
          }
          trap cleanup EXIT
          if [ -e "$READBACK_ROOT" ] || [ -L "$READBACK_ROOT" ]; then
            echo '{"status":"unavailable","reason":"temporary_root_unavailable"}'
            exit 1
          fi
          umask 077
          mkdir -m 700 "$READBACK_ROOT"
          mkdir -m 700 "$READBACK_ROOT/root"

          python3 - <<'PY'
          import json
          import os
          import stat
          import subprocess
          from pathlib import Path

          def fail(reason):
              print(json.dumps({'status': 'unavailable', 'reason': reason}))
              raise SystemExit(1)

          # Never silently fall back to the VPS user's pre-existing ADC.
          credential = os.environ.get('GOOGLE_APPLICATION_CREDENTIALS', '')
          override = os.environ.get('CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE', '')
          if not credential or override != credential:
              fail('temporary_identity_missing')
          try:
              path = Path(credential)
              if path.is_symlink() or not path.is_file():
                  fail('temporary_identity_invalid')
              if json.loads(path.read_text())['type'] != 'external_account':
                  fail('temporary_identity_invalid')
          except (OSError, ValueError, KeyError):
              fail('temporary_identity_invalid')

          source = os.environ['INPUT_ROOT']
          workspace = Path(os.environ['READBACK_ROOT'])
          local_root = workspace / 'root'
          members = {
              'binding.json': (local_root / 'binding.json', 1024 * 1024),
              'bars.json': (local_root / 'bars.json', 32 * 1024 * 1024),
              'manifest.json': (local_root / 'manifest.json', 1024 * 1024),
              'p1-complete.json': (workspace / 'p1-complete.json', 1024 * 1024),
          }
          observed_sizes = {}
          for name, (_, maximum) in members.items():
              try:
                  result = subprocess.run(
                      ['gcloud', 'storage', 'objects', 'describe', source + name, '--raw', '--format=json'],
                      capture_output=True, text=True, timeout=30, check=False,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail('metadata_read_unavailable')
              if result.returncode:
                  fail('metadata_read_unavailable')
              try:
                  size = int(json.loads(result.stdout)['size'])
              except (KeyError, ValueError, TypeError, json.JSONDecodeError):
                  fail('metadata_invalid')
              if size <= 0 or size > maximum:
                  fail('object_size_invalid')
              observed_sizes[name] = size
          if sum(observed_sizes.values()) > 35 * 1024 * 1024:
              fail('read_budget_exceeded')

          for name, (destination, _) in members.items():
              try:
                  result = subprocess.run(
                      ['gcloud', 'storage', 'cp', '--quiet', source + name, str(destination)],
                      capture_output=True, text=True, timeout=60, check=False,
                  )
              except (OSError, subprocess.TimeoutExpired):
                  fail('object_read_unavailable')
              if result.returncode:
                  fail('object_read_unavailable')
              try:
                  item_stat = destination.lstat()
              except OSError:
                  fail('object_read_unavailable')
              if not stat.S_ISREG(item_stat.st_mode) or item_stat.st_size != observed_sizes[name]:
                  fail('object_read_invalid')
          PY

          cd "$VALIDATOR_SOURCE"
          ROOT="$READBACK_ROOT/root" COMPLETION="$READBACK_ROOT/p1-complete.json" \
            env -u UV_PYTHON -u VIRTUAL_ENV uv run --no-sync python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p1_publisher import (
                  verify_soxl_core_only_input_root,
                  verify_soxl_core_only_p1_remote_completion,
              )
              manifest_sha256 = verify_soxl_core_only_input_root(Path(os.environ['ROOT']))
              if manifest_sha256 != os.environ['EXPECTED_MANIFEST_SHA256']:
                  raise ValueError
              if verify_soxl_core_only_p1_remote_completion(
                  Path(os.environ['ROOT']), Path(os.environ['COMPLETION'])
              ) != manifest_sha256:
                  raise ValueError
          except Exception:
              print(json.dumps({'status': 'unavailable', 'reason': 'p1_validation_failed'}))
              raise SystemExit(1) from None
          print(json.dumps({
              'status': 'accepted',
              'identity': 'github_oidc',
              'manifest_sha256': manifest_sha256,
              'member_count': 4,
              'research_executed': False,
          }))
          PY

          if [ "$OPERATION" = "soxl_learning" ]; then
            cd "$GITHUB_WORKSPACE"
            UV_PROJECT_ENVIRONMENT="$UES_ENV_ROOT" python3 -m scripts.run_soxl_manual_learning \
              --parameter-grid "$PARAMETER_GRID" \
              --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
              --root "$READBACK_ROOT/root" \
              --consumer-source "$CONSUMER_SOURCE" \
              --ues-source "$UES_SOURCE" \
              --output "$LEARNING_OUTPUT" \
              --repository "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF" \
              --event-name "$GITHUB_EVENT_NAME" \
              --actor "$GITHUB_ACTOR" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT"
          elif [ "$OPERATION" = "soxl_validation" ]; then
            cd "$GITHUB_WORKSPACE"
            UV_PROJECT_ENVIRONMENT="$UES_ENV_ROOT" "$VALIDATION_CONTROL_ENV/bin/python" -m scripts.run_soxl_manual_learning \
              --development-summary "$DEVELOPMENT_SOURCE_ROOT/summary.json" \
              --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
              --root "$READBACK_ROOT/root" \
              --consumer-source "$CONSUMER_SOURCE" \
              --ues-source "$UES_SOURCE" \
              --output "$LEARNING_OUTPUT" \
              --repository "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF" \
              --event-name "$GITHUB_EVENT_NAME" \
              --actor "$GITHUB_ACTOR" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT"
          fi

      - name: Upload the sanitized research record
        if: always() && inputs.operation != 'readback'
        uses: actions/upload-artifact@v7
        with:
          name: soxl-manual-learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aab-soxl-learning-${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: error
          retention-days: 35

      - name: Remove the bounded readback workspace
        if: always()
        env:
          READBACK_ROOT: ${{ runner.temp }}/aab-research-input-${{ github.run_id }}-${{ github.run_attempt }}
          LEARNING_OUTPUT_ROOT: ${{ runner.temp }}/aab-soxl-learning-${{ github.run_id }}-${{ github.run_attempt }}
          UES_ENV_ROOT: ${{ runner.temp }}/aab-soxl-ues-env-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$READBACK_ROOT" "$LEARNING_OUTPUT_ROOT" "$UES_ENV_ROOT" "$VALIDATION_CONTROL_ENV" "$DEVELOPMENT_SOURCE_ROOT"
