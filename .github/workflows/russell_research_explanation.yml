name: Russell Research Explanation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  explain:
    if: github.repository == 'QuantStrategyLab/AIAuditBridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPO: QuantStrategyLab/UsEquitySnapshotPipelines
      SOURCE_RUN_ID: '34807588512'
      CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
      CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
      AI_GATEWAY_SOURCE_REPO: QuantStrategyLab/AIAuditBridge
      AI_GATEWAY_RESEARCH_PROVIDERS: codex
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read fixed successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${SOURCE_REPO}/actions/runs/${SOURCE_RUN_ID}" > "$RUNNER_TEMP/russell-run.json"
          gh run view "$SOURCE_RUN_ID" --repo "$SOURCE_REPO" --log > "$RUNNER_TEMP/russell-run.log"
      - name: Explain and archive advisory result
        run: |
          set -euo pipefail
          python3 -m scripts.run_russell_research_explanation \
            --run-metadata "$RUNNER_TEMP/russell-run.json" \
            --run-log "$RUNNER_TEMP/russell-run.log" \
            --source-ref "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/russell-research-explanation/summary.json"
      - name: Retain sanitized research explanation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: russell-research-explanation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/russell-research-explanation/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove source logs and metadata
        if: always()
        run: rm -f "$RUNNER_TEMP/russell-run.json" "$RUNNER_TEMP/russell-run.log"
