name: Strategy Optimization Watcher

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository that owns strategy metrics and receives optimization issues"
        required: true
        default: "QuantStrategyLab/CryptoLivePoolPipelines"
      source_ref:
        description: "Source repository ref to inspect"
        required: false
        default: "main"
      metrics_path:
        description: "JSON metrics payload path inside the source repository"
        required: false
        default: "data/output/strategy_metrics.json"
      workflow_file:
        description: "Trusted source workflow file that produced the metrics artifact"
        required: false
        default: "monthly_publish.yml"
      metrics_filename:
        description: "Sanitized metrics filename inside each source artifact"
        required: false
        default: "strategy_metrics.json"
      dry_run:
        description: "Do not create GitHub issues"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 6 * * *"
    - cron: "23 6 * * *"

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

concurrency:
  group: strategy-optimization-watcher-${{ github.event.inputs.source_repo || vars.STRATEGY_WATCH_SOURCE_REPO || 'QuantStrategyLab/CryptoLivePoolPipelines' }}
  cancel-in-progress: false

jobs:
  strategy-optimization-watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      soxl_learning_ready: ${{ steps.soxl-watcher-learning-ready.outputs.ready }}
      soxl_p1_manifest_sha256: ${{ steps.soxl-watcher-learning-ready.outputs.p1_manifest_sha256 }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      SOURCE_REPO: ${{ github.event.inputs.source_repo || vars.STRATEGY_WATCH_SOURCE_REPO || 'QuantStrategyLab/CryptoLivePoolPipelines' }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || vars.STRATEGY_WATCH_SOURCE_REF || 'main' }}
      METRICS_PATH: ${{ github.event.schedule == '23 6 * * *' && 'data/output/soxl-p3-watcher-comparison.json' || github.event.inputs.metrics_path || vars.STRATEGY_WATCH_METRICS_PATH || 'data/output/strategy_metrics.json' }}
      SOURCE_WORKFLOW_FILE: ${{ github.event.schedule == '23 6 * * *' && 'soxl-p1-p3-daily-research.yml' || github.event.inputs.workflow_file || vars.STRATEGY_WATCH_WORKFLOW_FILE || 'monthly_publish.yml' }}
      METRICS_FILENAME: ${{ github.event.inputs.metrics_filename || vars.STRATEGY_WATCH_METRICS_FILENAME || 'strategy_metrics.json' }}
      TERMINAL_PROFILE: ${{ github.event.schedule == '23 6 * * *' && 'soxl_soxx_trend_income' || vars.STRATEGY_WATCH_TERMINAL_PROFILE || '' }}
      STRATEGY_WATCH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || vars.STRATEGY_WATCH_DRY_RUN || 'true' }}
      # Keep the watcher opt-in (dry-run remains the default), while allowing
      # the canonical US-equity metrics producer to be selected without a
      # repository-variable migration.
      ALLOWED_SOURCE_REPOS: ${{ vars.STRATEGY_WATCH_ALLOWED_SOURCE_REPOS || 'QuantStrategyLab/CryptoLivePoolPipelines,QuantStrategyLab/UsEquitySnapshotPipelines' }}
      ALLOWED_SOURCE_REFS: ${{ vars.STRATEGY_WATCH_ALLOWED_SOURCE_REFS || 'main' }}
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@v6.0.3
        with:
          path: bridge
          persist-credentials: false

      - name: Detect GitHub App Credentials
        id: app_credentials
        env:
          APP_ID: ${{ vars.CROSS_REPO_GITHUB_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CROSS_REPO_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Source Repository Name
        id: source_repo
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid SOURCE_REPO: ${SOURCE_REPO}. Expected owner/name." >&2
            exit 1
          fi
          allowed_match=false
          IFS=',' read -ra allowed_repos <<< "${ALLOWED_SOURCE_REPOS}"
          for allowed_repo in "${allowed_repos[@]}"; do
            allowed_repo="${allowed_repo//[[:space:]]/}"
            if [ "${allowed_repo}" = "${SOURCE_REPO}" ]; then
              allowed_match=true
              break
            fi
          done
          if [ "${allowed_match}" != "true" ]; then
            echo "SOURCE_REPO is not allowed for strategy watcher: ${SOURCE_REPO}" >&2
            exit 1
          fi
          ref_allowed=false
          IFS=',' read -ra allowed_refs <<< "${ALLOWED_SOURCE_REFS}"
          for allowed_ref in "${allowed_refs[@]}"; do
            allowed_ref="${allowed_ref//[[:space:]]/}"
            if [ "${allowed_ref}" = "${SOURCE_REF}" ]; then
              ref_allowed=true
              break
            fi
          done
          if [ "${ref_allowed}" != "true" ]; then
            echo "SOURCE_REF is not allowed for strategy watcher: ${SOURCE_REF}" >&2
            exit 1
          fi
          owner="${SOURCE_REPO%%/*}"
          repository="${SOURCE_REPO#*/}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App Token For Source Repository
        id: source_app_token
        if: steps.app_credentials.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.CROSS_REPO_GITHUB_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.source_repo.outputs.owner }}
          repositories: ${{ steps.source_repo.outputs.repository }}
          permission-actions: read
          permission-contents: read
          permission-issues: write

      - name: Verify Source Repository Token
        env:
          SOURCE_APP_TOKEN: ${{ steps.source_app_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ "${SOURCE_REPO}" != "${GITHUB_REPOSITORY}" ] && [ -z "${SOURCE_APP_TOKEN:-}" ]; then
            echo "Cross-repository strategy watcher requires CROSS_REPO_GITHUB_APP_ID and CROSS_REPO_GITHUB_APP_PRIVATE_KEY." >&2
            exit 1
          fi

      - name: Checkout Source Metrics
        uses: actions/checkout@v6.0.3
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          token: ${{ steps.source_app_token.outputs.token || github.token }}
          persist-credentials: false

      - name: Fetch comparable strategy metrics from trusted source artifacts
        id: fetch-metrics
        env:
          GH_TOKEN: ${{ steps.source_app_token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_WORKFLOW_FILE}" =~ ^[A-Za-z0-9_.-]+\.ya?ml$ ]]; then
            echo "Invalid SOURCE_WORKFLOW_FILE" >&2
            exit 1
          fi
          if [[ ! "${METRICS_FILENAME}" =~ ^[A-Za-z0-9_.-]+\.json$ ]]; then
            echo "Invalid METRICS_FILENAME" >&2
            exit 1
          fi
          echo "Looking for completed ${SOURCE_WORKFLOW_FILE} metrics on ${SOURCE_REF} in ${SOURCE_REPO}..."

          # Restrict to the canonical branch so we never consume metrics from a
          # feature-branch or PR workflow run.
          mapfile -t RUN_IDS < <(gh run list --repo "${SOURCE_REPO}" --workflow "${SOURCE_WORKFLOW_FILE}" --branch "${SOURCE_REF}" --status success --limit 5 --json databaseId --jq '.[].databaseId')

          if [ "${#RUN_IDS[@]}" -eq 0 ]; then
            echo "No successful source run on ${SOURCE_REF} in ${SOURCE_REPO} — metrics not available yet"
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p source/data/output
          if [ "${METRICS_FILENAME}" = "strategy_metrics.json" ]; then
            current_run_id="${RUN_IDS[0]}"
            if ! gh run download "${current_run_id}" --repo "${SOURCE_REPO}" --dir "source/data/output/_artifacts/${current_run_id}" 2>/dev/null; then
              echo "Artifact download from run ${current_run_id} failed"
              echo "downloaded=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            metrics_file=$(find "source/data/output/_artifacts/${current_run_id}" -name "strategy_metrics.json" -type f -print -quit)
            if [ -z "${metrics_file}" ]; then
              echo "strategy_metrics.json not found in trusted source artifacts"
              echo "downloaded=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cp "${metrics_file}" "source/${METRICS_PATH}"
            echo "Downloaded compatible strategy_metrics.json from run ${current_run_id}"
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#RUN_IDS[@]}" -lt 2 ]; then
            echo "Two completed observations are required before comparing strategy_performance.v2 metrics"
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_run_id="${RUN_IDS[0]}"
          if ! gh run download "${current_run_id}" --repo "${SOURCE_REPO}" --dir "source/data/output/_artifacts/${current_run_id}" 2>/dev/null; then
            echo "Artifact download from run ${current_run_id} failed"
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_file=$(find "source/data/output/_artifacts/${current_run_id}" -name "${METRICS_FILENAME}" -type f -print -quit)
          if [ -z "${current_file}" ]; then
            echo "Comparable ${METRICS_FILENAME} artifacts are not available yet"
            terminal_file=$(find "source/data/output/_artifacts/${current_run_id}" -name "p1-status.json" -type f -print -quit)
            if [ -n "${terminal_file}" ]; then
              case "${SOURCE_WORKFLOW_FILE}" in
                soxl-p1-p3-daily-research.yml)
                  echo "terminal_profile=${TERMINAL_PROFILE:-soxl_soxx_trend_income}" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              echo "terminal_status_path=${terminal_file#source/}" >> "$GITHUB_OUTPUT"
              echo "Found P1 terminal status for unavailable comparable metrics"
            fi
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          baseline_candidates=()
          for run_id in "${RUN_IDS[@]:1}"; do
            if ! gh run download "${run_id}" --repo "${SOURCE_REPO}" --dir "source/data/output/_artifacts/${run_id}" 2>/dev/null; then
              echo "Artifact download from run ${run_id} failed"
              echo "downloaded=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            baseline_file=$(find "source/data/output/_artifacts/${run_id}" -name "${METRICS_FILENAME}" -type f -print -quit)
            if [ -n "${baseline_file}" ]; then
              baseline_candidates+=(--baseline-candidate "${run_id}" "${baseline_file}")
            fi
          done
          if [ "${#baseline_candidates[@]}" -eq 0 ]; then
            echo "No earlier strategy performance observations are available yet"
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PYTHONPATH=bridge python - "${GITHUB_WORKSPACE}/source" "${METRICS_PATH}" <<'PY'
          import sys

          from scripts.run_strategy_optimization_watcher import resolve_input_path

          output = resolve_input_path(source_root=sys.argv[1], metrics_path=sys.argv[2])
          if output is None:
              raise SystemExit("invalid strategy metrics output path")
          output.unlink(missing_ok=True)
          PY
          python bridge/scripts/build_strategy_watcher_artifact_payload.py \
            --current "${current_file}" \
            "${baseline_candidates[@]}" \
            --source-repository "${SOURCE_REPO}" \
            --workflow-file "${SOURCE_WORKFLOW_FILE}" \
            --current-run-id "${current_run_id}" \
            --output "source/${METRICS_PATH}"
          if [ ! -f "source/${METRICS_PATH}" ]; then
            echo "No earlier comparable strategy performance observation is available yet"
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Built comparable watcher payload for current run ${current_run_id}"
          echo "downloaded=true" >> "$GITHUB_OUTPUT"

      - name: Run Strategy Optimization Watcher
        env:
          GH_TOKEN: ${{ steps.source_app_token.outputs.token || github.token }}
          STRATEGY_WATCH_SOURCE_ROOT: ${{ github.workspace }}/source
          STRATEGY_WATCH_METRICS_PATH: ${{ env.METRICS_PATH }}
          STRATEGY_WATCH_SOURCE_REPO: ${{ env.SOURCE_REPO }}
          STRATEGY_WATCH_TERMINAL_STATUS_PATH: ${{ steps.fetch-metrics.outputs.terminal_status_path }}
          STRATEGY_WATCH_TERMINAL_PROFILE: ${{ steps.fetch-metrics.outputs.terminal_profile }}
        working-directory: bridge
        run: |
          set -euo pipefail
          mkdir -p data/output/strategy_optimization_watcher
          # Module invocation keeps the repository root on sys.path even when
          # the runner changes its working directory or wraps this step.
          python -m scripts.run_strategy_optimization_watcher | tee data/output/strategy_optimization_watcher/result.json

      - name: Run one bounded Codex-only research diagnosis
        id: research-diagnosis
        if: steps.fetch-metrics.outputs.downloaded == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.source_app_token.outputs.token || github.token }}
          CODEX_AUDIT_SERVICE_URL: ${{ secrets.CODEX_AUDIT_SERVICE_URL }}
          CODEX_AUDIT_SERVICE_AUDIENCE: ${{ vars.CODEX_AUDIT_SERVICE_AUDIENCE || 'quant-codex-audit' }}
          RESEARCH_DIAGNOSIS_MAX_PER_RUN: "1"
        working-directory: bridge
        run: |
          set -euo pipefail
          python -m scripts.run_research_task_diagnosis \
            --input data/output/strategy_optimization_watcher/result.json \
            --max-per-run "${RESEARCH_DIAGNOSIS_MAX_PER_RUN}" \
            | tee data/output/strategy_optimization_watcher/research-diagnosis.json

      - name: Resolve exact SOXL watcher learning handoff
        id: soxl-watcher-learning-ready
        if: github.event.schedule == '23 6 * * *' && steps.fetch-metrics.outputs.downloaded == 'true'
        env:
          GH_TOKEN: ${{ steps.source_app_token.outputs.token || github.token }}
          SOURCE_GITHUB_APP_ID: ${{ vars.CROSS_REPO_GITHUB_APP_ID }}
        working-directory: bridge
        run: |
          set -euo pipefail
          output=data/output/strategy_optimization_watcher/soxl-watcher-learning-ready.json
          python -m scripts.run_soxl_manual_learning \
            --watcher-result data/output/strategy_optimization_watcher/result.json \
            --diagnosis-result data/output/strategy_optimization_watcher/research-diagnosis.json \
            --github-app-id "$SOURCE_GITHUB_APP_ID" \
            --watcher-preflight | tee "$output"
          python - "$output" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          ready = value.get("ready") is True
          with open(sys.argv[2], "a", encoding="utf-8") as target:
              target.write(f"ready={'true' if ready else 'false'}\n")
              if ready:
                  target.write(f"p1_manifest_sha256={value['p1_manifest_sha256']}\n")
          PY

      - name: Extract bounded research task source snapshot
        if: success()
        working-directory: bridge
        run: |
          set -euo pipefail
          python - data/output/strategy_optimization_watcher/result.json data/output/strategy_optimization_watcher/research-task-source.json <<'PY'
          import json
          import sys

          source = json.load(open(sys.argv[1], encoding="utf-8"))
          snapshot = source.get("research_task_source_snapshot")
          if not isinstance(snapshot, dict) or snapshot.get("schema_version") != "qsl_research_task_source_snapshot.v1":
              raise SystemExit("watcher did not emit a bounded research task source snapshot")
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(snapshot, handle, sort_keys=True, separators=(",", ":"), ensure_ascii=False, allow_nan=False)
          PY

      - name: Publish research task index to the unified console
        if: success() && github.event_name == 'schedule'
        env:
          RESEARCH_TASK_SYNC_URL: ${{ vars.QSL_RESEARCH_TASK_SYNC_URL }}
          RESEARCH_TASK_SYNC_TOKEN: ${{ secrets.QSL_RESEARCH_TASK_SYNC_TOKEN }}
        working-directory: bridge
        run: |
          set -euo pipefail
          if [ -z "${RESEARCH_TASK_SYNC_URL:-}" ] || [ -z "${RESEARCH_TASK_SYNC_TOKEN:-}" ]; then
            echo 'RESEARCH_TASK_SYNC_STATUS=NOT_CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
            echo 'Research task index is not configured; issue-only watcher behavior remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          input_path="data/output/strategy_optimization_watcher/research-task-source.json"
          response_path="data/output/strategy_optimization_watcher/research-task-response.json"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --connect-timeout 10 \
            --request POST \
            --header "Authorization: Bearer ${RESEARCH_TASK_SYNC_TOKEN}" \
            --header 'Content-Type: application/json' \
            --header 'User-Agent: QuantStrategyLab-AIAuditBridge-ResearchTask/1' \
            --data-binary "@$input_path" \
            --output "$response_path" \
            "${RESEARCH_TASK_SYNC_URL%/}/api/internal/sync-research-task-source"
          python - "$response_path" <<'PY'
          import json
          import sys

          response = json.load(open(sys.argv[1], encoding="utf-8"))
          if response.get("ok") is not True or response.get("schema_version") != "qsl_research_task_source_snapshot.v1":
              raise SystemExit("unexpected research task source response")
          PY
          echo 'RESEARCH_TASK_SYNC_STATUS=PUBLISHED' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload watcher diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strategy-optimization-watcher-${{ github.run_id }}
          path: bridge/data/output/strategy_optimization_watcher/
          if-no-files-found: warn

  soxl-watcher-learning:
    needs: strategy-optimization-watcher
    if: >-
      needs.strategy-optimization-watcher.outputs.soxl_learning_ready == 'true' &&
      github.repository == 'QuantStrategyLab/AIAuditBridge' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'schedule' &&
      vars.SOXL_WATCHER_GCP_WIF_PROVIDER != '' &&
      vars.SOXL_WATCHER_GCP_PROJECT_ID != ''
    runs-on: [self-hosted, codex-vps]
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      P1_MANIFEST_SHA256: ${{ needs.strategy-optimization-watcher.outputs.soxl_p1_manifest_sha256 }}
      LEARNING_ROOT: ${{ github.workspace }}/.aab-soxl-watcher-learning-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check dedicated scheduled research identity configuration
        id: research-identity
        env:
          WIF_PROVIDER: ${{ vars.SOXL_WATCHER_GCP_WIF_PROVIDER }}
          GCP_PROJECT_ID: ${{ vars.SOXL_WATCHER_GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${WIF_PROVIDER:-}" ] && [ -n "${GCP_PROJECT_ID:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'SOXL_WATCHER_LEARNING_STATUS=PARKED_IDENTITY_NOT_CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout Bridge
        if: steps.research-identity.outputs.configured == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: bridge
          persist-credentials: false

      - name: Download sanitized watcher handoff
        if: steps.research-identity.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: strategy-optimization-watcher-${{ github.run_id }}
          path: watcher-handoff

      - name: Create source issue token
        id: source-app-token
        if: steps.research-identity.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.CROSS_REPO_GITHUB_APP_ID }}
          private-key: ${{ secrets.CROSS_REPO_GITHUB_APP_PRIVATE_KEY }}
          owner: QuantStrategyLab
          repositories: UsEquitySnapshotPipelines
          permission-issues: write

      - name: Initialize sanitized watcher learning terminal
        if: steps.research-identity.outputs.configured == 'true'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$LEARNING_ROOT"
          chmod 700 "$LEARNING_ROOT"
          printf '%s\n' '{"schema_version":"qsl.soxl-manual-learning-run.v1","operation":"soxl_watcher_learning","status":"parked","failure_stage":"setup_incomplete","research_executed":false,"learning_only":true,"no_order":true,"size_zero_required":true,"promotion_eligible":false}' > "$LEARNING_ROOT/summary.json"

      - name: Checkout bounded learning consumer
        if: steps.research-identity.outputs.configured == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: QuantStrategyLab/UsEquitySnapshotPipelines
          ref: b03ecbe4e0a7a0de22f298499f867a7039e4b60a
          path: consumer-source
          persist-credentials: false

      - name: Checkout frozen strategy runtime
        if: steps.research-identity.outputs.configured == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: QuantStrategyLab/UsEquityStrategies
          ref: 7756fe32585e85cf1d09a163203a02e3eee39fe1
          path: ues-source
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.research-identity.outputs.configured == 'true'
        with:
          python-version: '3.11'

      - name: Install frozen numeric runtimes
        if: steps.research-identity.outputs.configured == 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'uv==0.11.19'
          cd consumer-source
          env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
          cd ../ues-source
          UV_PROJECT_ENVIRONMENT="$LEARNING_ROOT/ues-env" env -u UV_PYTHON -u VIRTUAL_ENV uv sync --locked --no-dev --no-editable --python 3.11
          rm -rf -- build
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Authenticate for task-bound immutable P1 read only
        if: steps.research-identity.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ vars.SOXL_WATCHER_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.SOXL_WATCHER_GCP_WIF_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Read and verify exact four-member P1 root
        if: steps.research-identity.outputs.configured == 'true'
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
          CLOUDSDK_CORE_DISABLE_USAGE_REPORTING: 'true'
        run: |
          set -euo pipefail
          umask 077
          root="$LEARNING_ROOT/p1-root"
          completion="$LEARNING_ROOT/p1-complete.json"
          source="gs://qsl-runtime-logs-shared/soxl-p1-p3/${P1_MANIFEST_SHA256}"
          mkdir -p "$root"
          chmod 700 "$LEARNING_ROOT" "$root"
          SOURCE="$source" ROOT="$root" COMPLETION="$completion" python3 - <<'PY'
          import json
          import os
          import stat
          import subprocess
          from pathlib import Path

          def fail(reason):
              print(json.dumps({"status": "unavailable", "reason": reason}))
              raise SystemExit(1)

          credential = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS", "")
          override = os.environ.get("CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE", "")
          try:
              credential_path = Path(credential)
              if not credential or override != credential or credential_path.is_symlink() or not credential_path.is_file():
                  fail("temporary_identity_invalid")
              if json.loads(credential_path.read_text())["type"] != "external_account":
                  fail("temporary_identity_invalid")
          except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError):
              fail("temporary_identity_invalid")

          source = os.environ["SOURCE"].rstrip("/") + "/"
          members = {
              "binding.json": (Path(os.environ["ROOT"]) / "binding.json", 1024 * 1024),
              "bars.json": (Path(os.environ["ROOT"]) / "bars.json", 32 * 1024 * 1024),
              "manifest.json": (Path(os.environ["ROOT"]) / "manifest.json", 1024 * 1024),
              "p1-complete.json": (Path(os.environ["COMPLETION"]), 1024 * 1024),
          }
          sizes = {}
          for name, (_, maximum) in members.items():
              try:
                  result = subprocess.run(
                      ["gcloud", "storage", "objects", "describe", source + name, "--raw", "--format=json"],
                      capture_output=True, text=True, timeout=30, check=False,
                  )
              except (OSError, subprocess.SubprocessError):
                  fail("p1_metadata_unavailable")
              if result.returncode:
                  fail("p1_metadata_unavailable")
              try:
                  size = int(json.loads(result.stdout)["size"])
              except (KeyError, TypeError, ValueError, json.JSONDecodeError):
                  fail("p1_metadata_invalid")
              if size <= 0 or size > maximum:
                  fail("p1_member_size_invalid")
              sizes[name] = size
          if sum(sizes.values()) > 35 * 1024 * 1024:
              fail("p1_read_budget_exceeded")
          for name, (destination, _) in members.items():
              try:
                  result = subprocess.run(
                      ["gcloud", "storage", "cp", "--quiet", source + name, str(destination)],
                      capture_output=True, text=True, timeout=60, check=False,
                  )
              except (OSError, subprocess.SubprocessError):
                  fail("p1_object_read_unavailable")
              if result.returncode:
                  fail("p1_object_read_unavailable")
              try:
                  item = destination.lstat()
              except OSError:
                  fail("p1_object_read_invalid")
              if not stat.S_ISREG(item.st_mode) or item.st_size != sizes[name]:
                  fail("p1_object_read_invalid")
          PY
          ROOT="$root" COMPLETION="$completion" EXPECTED_MANIFEST_SHA256="$P1_MANIFEST_SHA256" \
            consumer-source/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          try:
              from us_equity_snapshot_pipelines.lifecycle.soxl_core_only_p1_publisher import (
                  verify_soxl_core_only_input_root,
                  verify_soxl_core_only_p1_remote_completion,
              )
              root = Path(os.environ["ROOT"])
              expected = os.environ["EXPECTED_MANIFEST_SHA256"]
              if verify_soxl_core_only_input_root(root) != expected:
                  raise ValueError
              if verify_soxl_core_only_p1_remote_completion(root, Path(os.environ["COMPLETION"])) != expected:
                  raise ValueError
          except Exception:
              print('{"status":"unavailable","reason":"p1_validation_failed"}')
              raise SystemExit(1) from None
          PY

      - name: Run task-bound SOXL watcher learning consumer
        if: steps.research-identity.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.source-app-token.outputs.token }}
          UV_PROJECT_ENVIRONMENT: ${{ env.LEARNING_ROOT }}/ues-env
        working-directory: bridge
        run: |
          set -euo pipefail
          python -m scripts.run_soxl_manual_learning --watcher-result \
            ../watcher-handoff/result.json \
            --diagnosis-result ../watcher-handoff/research-diagnosis.json \
            --github-app-id "${{ vars.CROSS_REPO_GITHUB_APP_ID }}" \
            --manifest-sha256 "$P1_MANIFEST_SHA256" \
            --root "$LEARNING_ROOT/p1-root" \
            --consumer-source "$GITHUB_WORKSPACE/consumer-source" \
            --ues-source "$GITHUB_WORKSPACE/ues-source" \
            --output "$LEARNING_ROOT/summary.json"

      - name: Record known pre-numeric failure for this exact task
        if: failure() && steps.research-identity.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.source-app-token.outputs.token }}
        working-directory: bridge
        run: |
          set -euo pipefail
          python -m scripts.run_soxl_manual_learning \
            --watcher-result ../watcher-handoff/result.json \
            --diagnosis-result ../watcher-handoff/research-diagnosis.json \
            --github-app-id "${{ vars.CROSS_REPO_GITHUB_APP_ID }}" \
            --watcher-record-pre-numeric-failure

      - name: Upload sanitized watcher learning terminal
        if: always() && steps.research-identity.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: soxl-watcher-learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LEARNING_ROOT }}/summary.json
          if-no-files-found: error
          retention-days: 35

      - name: Remove watcher learning workspace
        if: always()
        run: rm -rf -- "$LEARNING_ROOT"
