          EXPECTED_DAILY = set("scripts scripts.consume_daily_briefing scripts.run_strategy_optimization_watcher service service.adapters service.adapters.codex_adapter service.adapters.cursor_adapter service.adapters.execution service.adapters.llm_adapter service.automation_contracts service.autonomy service.briefing_consumer service.briefing_dispatch service.contracts service.dual_review service.dual_review_briefing service.dual_review_dispatch service.dual_review_gateway service.dual_review_orchestrator service.dual_review_secondary service.dual_review_triggers service.model_catalog service.model_catalog_sync service.model_resolver service.model_router service.research_task service.runtime_digest service.strategy_automation_registry service.strategy_optimization_policy service.strategy_watch".split())
          HASHES = {"drift_detector.py": "82d3d992ac0390ed45aae627e363720d120402a2321e33d9fe458c73cb1171d3",
                    "health_dashboard.py": "d23f400705b7970d7d33a115f06f15bd4c0c7ad614493dde84559be5f4dbc62e",
                    "performance_monitor.py": "bba42a051bc2bddaea0b548f425209ecabd904e88ea6b551ba52b810c35b964b",
                    "return_collector.py": "ad6c3b61ff668e5c540326b96cc1be0da20d14855fc71701bd805c0299ab890a"}
          EXPECTED_SOURCE_BYTES = 480370

          SOURCE_FILES = (
              'client/__init__.py',
              'client/config.py',
              'client/errors.py',
              'client/gateway_client.py',
              'ops/quant-monitor/qpk-runtime.sha',
              'ops/quant-monitor/requirements-linux-py312.lock',
              'ops/quant-monitor/scripts/build_dashboard_snapshot.py',
              'ops/quant-monitor/scripts/daily_briefing_builder.py',
              'ops/quant-monitor/scripts/health_cycle.py',
              'scripts/__init__.py',
              'scripts/consume_daily_briefing.py',
              'scripts/run_strategy_optimization_watcher.py',
              'service/__init__.py',
              'service/adapters/__init__.py',
              'service/adapters/codex_adapter.py',
              'service/adapters/cursor_adapter.py',
              'service/adapters/execution.py',
              'service/adapters/llm_adapter.py',
              'service/automation_contracts.py',
              'service/autonomy.py',
              'service/briefing_consumer.py',
              'service/briefing_dispatch.py',
              'service/contracts.py',
              'service/dual_review.py',
              'service/dual_review_briefing.py',
              'service/dual_review_dispatch.py',
              'service/dual_review_gateway.py',
              'service/dual_review_orchestrator.py',
              'service/dual_review_secondary.py',
              'service/dual_review_triggers.py',
              'service/model_catalog.py',
              'service/model_catalog_sync.py',
              'service/model_resolver.py',
              'service/model_router.py',
              'service/provider_scenarios.py',
              'service/research_task.py',
              'service/runtime_digest.py',
              'service/strategy_automation_registry.py',
              'service/strategy_optimization_policy.py',
              'service/strategy_watch.py',
          )

          def blob_hash(content):
              return hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()

          def verify_snapshot(root, manifest, directories):
              expected = set(manifest) | directories
              seen = set()
              check(root.is_dir() and not root.is_symlink() and root.resolve() == root)
              check(stat.S_IMODE(root.stat().st_mode) == 0o700)
              def visit(directory):
                  for path in directory.iterdir():
                      relative = str(path.relative_to(root))
                      check(relative in expected and relative not in seen)
                      seen.add(relative)
                      info = path.lstat()
                      mode = info.st_mode
                      if relative in directories:
                          check(stat.S_ISDIR(mode) and stat.S_IMODE(mode) == 0o755)
                          visit(path)
                      else:
                          expected_mode, oid, size = manifest[relative]
                          check(stat.S_ISREG(mode) and info.st_nlink == 1 and stat.S_IMODE(mode) == int(expected_mode, 8) & 0o777)
                          content = path.read_bytes()
                          check(len(content) == size and blob_hash(content) == oid)
              visit(root)
              check(seen == expected)

          failure = "candidate_metadata"
          import_target = "not_started"
          target_enums = dict(zip(TARGETS, ("qpk_drift", "qpk_dashboard", "qpk_performance", "qpk_returns",
                                            "daily_consumer", "client_config", "client_gateway", "provider_scenarios")))
          counts = {"network": 0, "process": 0, "write": 0, "read": 0}

          def check(condition):
              if not condition:
                  raise ValueError("candidate import check failed")

          def beneath(path, root):
              return path == root or path.is_relative_to(root)

          def category(name):
              if name in OPS_IMPORTS or name.split(".")[0] in {"scripts", "service", "client"}:
                  return "aab"
              if name.split(".")[0] == "quant_platform_kit":
                  return "qpk"
              return None

          # Suppress native and Python import output alike; only the final whitelist is emitted.
          original_stdout = os.dup(1)
          original_stderr = os.dup(2)
          sink = os.open(os.devnull, os.O_WRONLY)
          os.dup2(sink, 1)
          os.dup2(sink, 2)
          try:
              check(Path(sys.prefix).resolve() == CANDIDATE and sys.prefix != sys.base_prefix)
              check(sys.version_info[:2] == (3, 12) and sys.flags.isolated and sys.flags.no_user_site and sys.dont_write_bytecode)
              check(len(sys.argv) == 4 and re.fullmatch(r"[1-9][0-9]*", sys.argv[3]) is not None)
              check(RELEASE.is_absolute() and RELEASE.is_dir() and not RELEASE.is_symlink())
              check(stat.S_IMODE(RELEASE.stat().st_mode) == 0o700)
              check(CANDIDATE.resolve() == CANDIDATE and RELEASE.resolve() == RELEASE)
              failure = "source_manifest"
              result = subprocess.run(["/usr/bin/git", "-C", sys.argv[1], "ls-tree", "-rlz", "--full-tree", SOURCE_SHA, "--", *SOURCE_FILES],
                                      env={"PATH": "/usr/bin:/bin", "GIT_CONFIG_NOSYSTEM": "1", "GIT_CONFIG_GLOBAL": "/dev/null", "GIT_NO_REPLACE_OBJECTS": "1"},
                                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=30, check=True)
              manifest = {}
              for entry in result.stdout.split(b"\0"):
                  if entry:
                      metadata, path = entry.split(b"\t", 1)
                      mode, kind, oid, size = metadata.decode().split()
                      name = path.decode()
                      check(name in SOURCE_FILES and name not in manifest and kind == "blob" and mode in {"100644", "100755"})
                      check(re.fullmatch(r"[0-9a-f]{40}", oid) is not None and size.isdecimal())
                      manifest[name] = (mode, oid, int(size))
              check(set(manifest) == set(SOURCE_FILES) and len(manifest) == 40)
              check(sum(item[2] for item in manifest.values()) == EXPECTED_SOURCE_BYTES)
              directories = {str(parent) for name in manifest for parent in Path(name).parents if str(parent) != "."}
              verify_snapshot(RELEASE, manifest, directories)
              public_source_files = {RELEASE / name for name in manifest}
              public_source_directories = {RELEASE} | {RELEASE / name for name in directories}
              failure = "candidate_metadata"
              versions = {}
              for line in (RELEASE / "ops/quant-monitor/requirements-linux-py312.lock").read_text().splitlines():
                  if not line or line.startswith("#") or line == "--only-binary=:all:":
                      continue
                  match = re.fullmatch(r"([A-Za-z0-9_-]+)==([^ ]+) --hash=sha256:[0-9a-f]{64}", line)
                  check(match is not None and match[1] not in versions)
                  versions[match[1]] = match[2]
              check(len(versions) == 27)
              for name, version in {**versions, "quant-platform-kit": "1.0.0"}.items():
                  dist = importlib.metadata.distribution(name)
                  check(dist.version == version and beneath(Path(dist.locate_file("")).resolve(), CANDIDATE))
              qpk = importlib.metadata.distribution("quant-platform-kit")
              qpk_root = Path(qpk.locate_file("quant_platform_kit")).resolve()
              check(beneath(qpk_root, CANDIDATE))
              qpk_records = {Path(qpk.locate_file(p)).resolve(): p.hash for p in qpk.files or [] if str(p).startswith("quant_platform_kit/")}
              for name, digest in HASHES.items():
                  check(hashlib.sha256((qpk_root / "strategy_lifecycle" / name).read_bytes()).hexdigest() == digest)
              check(bool(manifest) and not any(category(name) for name in sys.modules))
              stdlib = Path(sysconfig.get_path("stdlib")).resolve()
              initial_paths = [Path(p).resolve() for p in sys.path]
              check(all(p in {stdlib, stdlib / "lib-dynload", stdlib.parent / "python312.zip"} or beneath(p, CANDIDATE) for p in initial_paths))
              allowed_reads = (stdlib, CANDIDATE, Path("/usr/share/zoneinfo"))
              runtime_leaves = (RELEASE / ".git", RELEASE / "ops/quant-monitor/data", RELEASE / "ops/quant-monitor/.venv")
              def audit(event, args):
                  kind = None
                  if event.startswith("socket."):
                      kind = "network"
                  elif event in {"subprocess.Popen", "os.system", "os.exec", "os.posix_spawn", "os.spawn", "os.fork", "os.forkpty"}:
                      kind = "process"
                  elif event in {"os.remove", "os.rename", "os.rmdir", "os.mkdir", "os.link", "os.symlink", "os.chmod", "os.chown", "os.truncate", "os.utime"}:
                      kind = "write"
                  elif event in {"open", "os.listdir", "os.scandir"}:
                      path = args[0]
                      mode, flags = args[1:] if event == "open" else (None, 0)
                      if (mode and any(c in mode for c in "wax+")) or flags & (os.O_WRONLY | os.O_RDWR | os.O_CREAT | os.O_TRUNC | os.O_APPEND):
                          kind = "write"
                      elif not isinstance(path, (str, bytes)):
                          kind = "read"
                      else:
                          lexical = Path(os.fsdecode(path)).absolute()
