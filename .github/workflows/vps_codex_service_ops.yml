              result = subprocess.run(["/usr/bin/git", "-C", str(repo), "ls-tree", "-rz", "--full-tree", SOURCE_SHA],
                                      env=ENV, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=30, check=True)
              tree = {}
              for entry in result.stdout.split(b"\0"):
                  if not entry:
                      continue
                  metadata, raw_path = entry.split(b"\t", 1)
                  mode, kind, oid = metadata.decode().split()
                  path = raw_path.decode()
                  check(kind == "blob" and mode in {"100644", "100755", "120000"})
                  check(not path.startswith("/") and ".." not in Path(path).parts and path not in tree)
                  tree[path] = (mode, oid)
              check(bool(tree))
              return tree

          def verify_tree(release, tree):
              links = {"ops/quant-monitor/data": DATA, "ops/quant-monitor/.venv": CANDIDATE}
              check(not set(links) & set(tree))
              expected = set(tree) | set(links)
              directories = {str(parent) for name in expected for parent in Path(name).parents if str(parent) != "."}
              expected |= directories
              seen = set()
              check(release.is_dir() and not release.is_symlink() and release.resolve() == release)
              check(stat.S_IMODE(release.stat().st_mode) == 0o755)
              def visit(directory):
                  for path in directory.iterdir():
                      relative = str(path.relative_to(release))
                      seen.add(relative)
                      check(relative in expected)
                      mode = path.lstat().st_mode
                      if relative in links:
                          check(stat.S_ISLNK(mode) and os.readlink(path) == str(links[relative]))
                          check(path.resolve(strict=True) == links[relative])
                      elif relative in directories:
                          check(stat.S_ISDIR(mode) and stat.S_IMODE(mode) == 0o755)
                          visit(path)
