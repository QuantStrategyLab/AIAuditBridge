name: VPS Codex Service Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - inspect-quant-runtime
          - inspect-quant-paths
          - preview-longbridge-paper-once
          - send-longbridge-paper-once
          - stage-quant-runtime-inactive
          - install-quant-release-inactive
          - check-quant-consumers-offline
          - inspect-monitor-failures
          - inspect-daily-failure-sample
          - inspect-recorded-daily-errors
          - inspect-audit-patch
          - apply-audit-patch
          - retry-audit-patch-once
          - release-gateway-failure-repairs
          - deploy
          - repair-ssh
          - install-org-health-token
      runtime_business_day:
        description: "Exact business day for the notification-only modes"
        required: false
        default: ""
      acknowledge_interruption:
        description: "Accept possible interruption of sync/async AI requests; snapshot is not a drain"
        type: boolean
        required: false
        default: false
      ssh_unban_ip:
        description: "Optional IP to unban from sshd/fail2ban"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: vps-codex-service-ops
  cancel-in-progress: false

jobs:
  check-quant-consumers-offline:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'QuantStrategyLab/AIAuditBridge' && github.ref == 'refs/heads/main' && inputs.mode == 'check-quant-consumers-offline' && !inputs.acknowledge_interruption && inputs.ssh_unban_ip == ''
    environment: codex-vps-ops
    runs-on:
      - self-hosted
      - codex-vps
    timeout-minutes: 10
    steps:
      - name: Checkout fixed consumer application source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 35ac71176127f07e00fe04dbc793777f3c595bc0
          persist-credentials: false

      - name: Verify exact main controller and fixed clean application source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          RUN_WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ inputs.mode }}
          RUN_ACK: ${{ inputs.acknowledge_interruption }}
          RUN_UNBAN_IP: ${{ inputs.ssh_unban_ip }}
        run: |
          set -euo pipefail
          [ "$RUN_EVENT_NAME" = workflow_dispatch ]
          [ "$RUN_MODE" = check-quant-consumers-offline ]
          [ "$RUN_REPOSITORY" = QuantStrategyLab/AIAuditBridge ]
          [ "$RUN_REF" = refs/heads/main ]
          [ "$RUN_ACK" = false ]
          [ -z "$RUN_UNBAN_IP" ]
          [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$RUN_WORKFLOW_REF" = QuantStrategyLab/AIAuditBridge/.github/workflows/vps_codex_service_ops.yml@refs/heads/main ]
          [ "$RUN_WORKFLOW_SHA" = "$RUN_SHA" ]
          cd "$GITHUB_WORKSPACE"
          [ "$(pwd -P)" = "$GITHUB_WORKSPACE" ]
          [ "$(git rev-parse HEAD)" = 35ac71176127f07e00fe04dbc793777f3c595bc0 ]
          [ -z "$(git status --porcelain --untracked-files=all)" ]
          current_main="$(timeout 30s gh api repos/QuantStrategyLab/AIAuditBridge/git/ref/heads/main --jq '.object.sha')"
          [ "$current_main" = "$RUN_SHA" ]
          sha256sum --check --status <<'SHA256'
          23d7349718fb61cd8e841641f2197dddf90ae04f1b8b9e5ccd9ac3417eb0165f  ops/quant-monitor/scripts/common_env.sh
          e8d4ffe8c5d89347dd4790ce02b0d5867fb8ee922b0c11aa4d680cd31a73f644  ops/quant-monitor/requirements-linux-py312.lock
          bd5f3531aeb52dd77e4d6a08ad2bc1cb6adec7223c25abb572586d982ec968e9  ops/quant-monitor/qpk-runtime.sha
          SHA256

      - name: Prepare one tracked temporary consumer source snapshot
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C /usr/bin/python3 -I -B - \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$GITHUB_RUN_ID" <<'PY'
          import hashlib
          import io
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import subprocess
          import sys
          import tarfile

          SOURCE_SHA = "35ac71176127f07e00fe04dbc793777f3c595bc0"
          EXPECTED_SOURCE_BYTES = 480370
          SOURCE_FILES = (
              'client/__init__.py',
              'client/config.py',
              'client/errors.py',
              'client/gateway_client.py',
              'ops/quant-monitor/qpk-runtime.sha',
              'ops/quant-monitor/requirements-linux-py312.lock',
              'ops/quant-monitor/scripts/build_dashboard_snapshot.py',
              'ops/quant-monitor/scripts/daily_briefing_builder.py',
              'ops/quant-monitor/scripts/health_cycle.py',
              'scripts/__init__.py',
              'scripts/consume_daily_briefing.py',
              'scripts/run_strategy_optimization_watcher.py',
              'service/__init__.py',
              'service/adapters/__init__.py',
              'service/adapters/codex_adapter.py',
              'service/adapters/cursor_adapter.py',
              'service/adapters/execution.py',
              'service/adapters/llm_adapter.py',
              'service/automation_contracts.py',
              'service/autonomy.py',
              'service/briefing_consumer.py',
              'service/briefing_dispatch.py',
              'service/contracts.py',
              'service/dual_review.py',
              'service/dual_review_briefing.py',
              'service/dual_review_dispatch.py',
              'service/dual_review_gateway.py',
              'service/dual_review_orchestrator.py',
              'service/dual_review_secondary.py',
              'service/dual_review_triggers.py',
              'service/model_catalog.py',
              'service/model_catalog_sync.py',
              'service/model_resolver.py',
              'service/model_router.py',
              'service/provider_scenarios.py',
              'service/research_task.py',
              'service/runtime_digest.py',
              'service/strategy_automation_registry.py',
              'service/strategy_optimization_policy.py',
              'service/strategy_watch.py',
          )
          ENV = {"PATH": "/usr/bin:/bin", "LANG": "C", "LC_ALL": "C", "GIT_CONFIG_NOSYSTEM": "1",
                 "GIT_CONFIG_GLOBAL": "/dev/null", "GIT_NO_REPLACE_OBJECTS": "1", "GIT_CONFIG_COUNT": "2",
                 "GIT_CONFIG_KEY_0": "core.hooksPath", "GIT_CONFIG_VALUE_0": "/dev/null",
                 "GIT_CONFIG_KEY_1": "core.fsmonitor", "GIT_CONFIG_VALUE_1": "false"}
          failure = "source_directory"

          def check(condition):
              if not condition:
                  raise ValueError("temporary source validation failed")

          def git(repo, *args):
              return subprocess.run(["/usr/bin/git", "-C", str(repo), *args], env=ENV,
                                    stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=30, check=True).stdout

          def blob_hash(content):
              return hashlib.sha1(b"blob " + str(len(content)).encode() + b"\0" + content).hexdigest()

          def verify_snapshot(root, manifest, directories):
              expected = set(manifest) | directories
              seen = set()
              check(root.is_dir() and not root.is_symlink() and root.resolve() == root)
              check(stat.S_IMODE(root.stat().st_mode) == 0o700)
              def visit(directory):
                  for path in directory.iterdir():
                      relative = str(path.relative_to(root))
                      check(relative in expected and relative not in seen)
                      seen.add(relative)
                      info = path.lstat()
                      mode = info.st_mode
                      if relative in directories:
                          check(stat.S_ISDIR(mode) and stat.S_IMODE(mode) == 0o755)
                          visit(path)
                      else:
                          expected_mode, oid, size = manifest[relative]
                          check(stat.S_ISREG(mode) and info.st_nlink == 1 and stat.S_IMODE(mode) == int(expected_mode, 8) & 0o777)
                          content = path.read_bytes()
                          check(len(content) == size and blob_hash(content) == oid)
              visit(root)
              check(seen == expected)

          try:
              check(len(sys.argv) == 4 and re.fullmatch(r"[1-9][0-9]*", sys.argv[3]) is not None)
              repo, temporary = Path(sys.argv[1]), Path(sys.argv[2])
              blocked = (Path("/opt/quant-monitor"), Path("/home/ubuntu/quant-monitor-runtime"),
                         Path("/home/ubuntu/quant-monitor-data03-286757-py312-v1"))
              check(repo.is_absolute() and temporary.is_absolute() and temporary != Path("/"))
              check(not any(temporary == p or temporary.is_relative_to(p) or p.is_relative_to(temporary) for p in (*blocked, repo)))
              check(repo.is_dir() and temporary.is_dir() and repo.resolve() == repo and temporary.resolve() == temporary)
              snapshot = temporary / ("quant-monitor-consumer-imports-35ac-" + sys.argv[3])
              check(not os.path.lexists(snapshot))
              failure = "source_manifest"
              manifest = {}
              for entry in git(repo, "ls-tree", "-rlz", "--full-tree", SOURCE_SHA, "--", *SOURCE_FILES).split(b"\0"):
                  if not entry:
                      continue
                  metadata, path_bytes = entry.split(b"\t", 1)
                  mode, kind, oid, size = metadata.decode().split()
                  path = path_bytes.decode()
                  check(path in SOURCE_FILES and path not in manifest and kind == "blob" and mode in {"100644", "100755"})
                  check(re.fullmatch(r"[0-9a-f]{40}", oid) is not None and size.isdecimal())
                  manifest[path] = (mode, oid, int(size))
              check(set(manifest) == set(SOURCE_FILES) and len(manifest) == 40)
              check(sum(item[2] for item in manifest.values()) == EXPECTED_SOURCE_BYTES)
              directories = {str(parent) for name in manifest for parent in PurePosixPath(name).parents if str(parent) != "."}
              failure = "archive_command"
              archive = git(repo, "archive", "--format=tar", SOURCE_SHA, "--", *SOURCE_FILES)
              check(len(archive) <= 2 * 1024 * 1024)
              failure = "archive_validation"
              contents, seen = {}, set()
              with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as bundle:
                  for member in bundle.getmembers():
                      name = member.name.rstrip("/")
                      path = PurePosixPath(name)
                      check(name and not path.is_absolute() and ".." not in path.parts and str(path) == name)
                      check(not {".git", ".venv", "data"} & set(path.parts))
                      check(name not in seen and name in set(manifest) | directories)
                      seen.add(name)
                      check(member.sparse is None and not member.mode & 0o7000)
                      if name in directories:
                          check(member.type == tarfile.DIRTYPE)
                          continue
                      expected_mode, oid, size = manifest[name]
                      check(member.type in {tarfile.REGTYPE, tarfile.AREGTYPE} and member.size == size)
                      check(member.mode & 0o111 == int(expected_mode, 8) & 0o111)
                      stream = bundle.extractfile(member)
                      check(stream is not None)
                      content = stream.read(size + 1)
                      check(len(content) == size and blob_hash(content) == oid)
                      contents[name] = content
              check(seen == set(manifest) | directories and set(contents) == set(manifest))
              check(contents["ops/quant-monitor/qpk-runtime.sha"] == b"28675796cabbe137a1fa3970b70d1aa98e952c88\n")
              failure = "snapshot_creation"
              snapshot.mkdir(mode=0o700)
              snapshot.chmod(0o700, follow_symlinks=False)
              # All modes apply only to newly created task-owned paths, never existing runtime paths.
              for name in sorted(directories, key=lambda value: (len(PurePosixPath(value).parts), value)):
                  directory = snapshot / name
                  directory.mkdir(mode=0o755)
                  directory.chmod(0o755, follow_symlinks=False)
              for name, content in contents.items():
                  mode = int(manifest[name][0], 8) & 0o777
                  descriptor = os.open(snapshot / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, mode)
                  with os.fdopen(descriptor, "wb") as stream:
                      os.fchmod(stream.fileno(), mode)
                      stream.write(content)
              failure = "snapshot_verification"
              verify_snapshot(snapshot, manifest, directories)
              print(json.dumps({"stage": "temporary_consumer_source_verified", "source_sha": SOURCE_SHA,
                                "source_files_checked": 40, "source_bytes_checked": EXPECTED_SOURCE_BYTES,
                                "source_kind": "task_temporary_snapshot", "runtime_links_created": 0,
                                "immutable_release_proof": False, "application_import_proof": False,
                                "runtime_adoption_proof": False}))
          except BaseException:
              print("[offline-consumers] failure=" + failure + "; no reuse or cleanup")
              raise SystemExit(1) from None
          PY

      - name: Import consumers from the temporary source without runtime adoption
        run: |
          set -euo pipefail
          candidate=/home/ubuntu/quant-monitor-data03-286757-py312-v1
          env -i PATH=/usr/bin:/bin LANG=C LC_ALL=C "$candidate/bin/python" -I -B - \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$GITHUB_RUN_ID" 2>/dev/null <<'PY'
          import base64
          import hashlib
          import importlib
          import importlib.metadata
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import stat
          import sys
          import sysconfig
          import tempfile

          SOURCE_SHA = "35ac71176127f07e00fe04dbc793777f3c595bc0"
          QPK_PIN = "28675796cabbe137a1fa3970b70d1aa98e952c88"
          RELEASE = Path(sys.argv[2]) / ("quant-monitor-consumer-imports-35ac-" + sys.argv[3])
          CANDIDATE = Path("/home/ubuntu/quant-monitor-data03-286757-py312-v1")
          OPS_IMPORTS = {"health_cycle": "ops/quant-monitor/scripts/health_cycle.py",
                         "daily_briefing_builder": "ops/quant-monitor/scripts/daily_briefing_builder.py",
                         "build_dashboard_snapshot": "ops/quant-monitor/scripts/build_dashboard_snapshot.py"}
          TARGETS = ("quant_platform_kit.strategy_lifecycle.drift_detector",
