name: VPS Codex Service Ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        required: true
        type: choice
        default: inspect
        options:
          - inspect
          - deploy
          - repair-ssh
          - install-org-health-token
      ssh_unban_ip:
        description: "Optional IP to unban from sshd/fail2ban"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: vps-codex-service-ops
  cancel-in-progress: false

jobs:
  vps-codex-service-ops:
    if: inputs.mode != 'install-org-health-token'
    # Bind to a protected environment when available so deploy/repair-ssh requires approval.
    environment: codex-vps-ops
    runs-on:
      - self-hosted
      - codex-vps
    timeout-minutes: 15
    steps:
      - name: Checkout Bridge
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify trusted QPK drift workflow refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in \
            644cd9002ae92f2aaca6f7efb4afa4986fae05ea \
            d0a081ca5868faaf1a6dd870cf4b93643978cd11 \
            fcddef20eea5deb876e739263042acdcb3e9cd1b \
            4f8465b28a6787d39d21e50f9d95a77841d6ad56 \
            651c9ac4f37ce6e7fe1bac84dc7646cd5abc9e6e \
            bb91e4cad1a32d58dc0e4023f1cbe0c7ec150d81 \
            6b887d9954eb656141597eac077ca22053a525ef \
            b939522701b527096e5d028346e777714466bcc5 \
            8b8ce3543c04bf12920e38b0f45d2b32a8896580; do
            gh api \
              "repos/QuantStrategyLab/QuantPlatformKit/contents/.github/workflows/reusable-drift-check.yml?ref=${ref}" \
              --jq '.sha' >/dev/null
          done

      - name: Run VPS service operation
        env:
          CODEX_AUDIT_SSH_UNBAN_IP: ${{ inputs.ssh_unban_ip }}
          CODEX_AUDIT_SERVICE_ALLOWED_REPOSITORIES: QuantStrategyLab/AIAuditBridge,QuantStrategyLab/BinancePlatform,QuantStrategyLab/CharlesSchwabPlatform,QuantStrategyLab/CnEquitySnapshotPipelines,QuantStrategyLab/CnEquityStrategies,QuantStrategyLab/CryptoLivePoolPipelines,QuantStrategyLab/CryptoStrategies,QuantStrategyLab/FirstradePlatform,QuantStrategyLab/HkEquitySnapshotPipelines,QuantStrategyLab/HkEquityStrategies,QuantStrategyLab/IBKRGatewayManager,QuantStrategyLab/InteractiveBrokersPlatform,QuantStrategyLab/LongBridgePlatform,QuantStrategyLab/MarketSignalSources,QuantStrategyLab/PoliticalEventTrackingResearch,QuantStrategyLab/QmtPlatform,QuantStrategyLab/QuantAdvisorResearch,QuantStrategyLab/QuantPlatformKit,QuantStrategyLab/QuantRuntimeSettings,QuantStrategyLab/QuantStrategyPlugins,QuantStrategyLab/ResearchSignalContextPipelines,QuantStrategyLab/SchwabTokenAutoRefresher,QuantStrategyLab/UsEquitySnapshotPipelines,QuantStrategyLab/UsEquityStrategies
          # workflow_dispatch emits protected-main workflow_ref claims; the deploy script pins delegated QPK code by exact job_workflow_ref SHA.
          CODEX_AUDIT_SERVICE_ALLOWED_WORKFLOW_REFS: QuantStrategyLab/AIAuditBridge/.github/workflows/codex_audit.yml@refs/heads/main,QuantStrategyLab/AIAuditBridge/.github/workflows/research_input_readback.yml@refs/heads/main,QuantStrategyLab/AIAuditBridge/.github/workflows/strategy_optimization_watcher.yml@refs/heads/main,QuantStrategyLab/AIAuditBridge/.github/workflows/portfolio_research_proposal_diagnosis.yml@refs/heads/main,QuantStrategyLab/AIAuditBridge/.github/workflows/dependency_audit.yml@refs/heads/main,QuantStrategyLab/CnEquityStrategies/.github/workflows/drift-check.yml@refs/heads/main,QuantStrategyLab/HkEquityStrategies/.github/workflows/drift-check.yml@refs/heads/main,QuantStrategyLab/UsEquityStrategies/.github/workflows/drift-check.yml@refs/heads/main,QuantStrategyLab/CryptoStrategies/.github/workflows/drift-check.yml@refs/heads/main
          CODEX_AUDIT_SERVICE_ALLOWED_REFS: refs/heads/main
          # Exact canonical audit job plus immutable QPK `uses:` refs pinned by strategy drift callers.
          # Rotation tracked in #64; remove the old QPK SHA after final strategy-run verification.
          CODEX_AUDIT_SERVICE_ALLOWED_JOB_WORKFLOW_REFS: QuantStrategyLab/AIAuditBridge/.github/workflows/codex_audit.yml@refs/heads/main,QuantStrategyLab/AIAuditBridge/.github/workflows/research_input_readback.yml@refs/heads/main,QuantStrategyLab/AIAuditBridge/.github/workflows/dependency_audit.yml@refs/heads/main,QuantStrategyLab/AIAuditBridge/.github/workflows/strategy_optimization_watcher.yml@refs/heads/main,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@644cd9002ae92f2aaca6f7efb4afa4986fae05ea,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@d0a081ca5868faaf1a6dd870cf4b93643978cd11,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@fcddef20eea5deb876e739263042acdcb3e9cd1b,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@4f8465b28a6787d39d21e50f9d95a77841d6ad56,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@651c9ac4f37ce6e7fe1bac84dc7646cd5abc9e6e,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@bb91e4cad1a32d58dc0e4023f1cbe0c7ec150d81,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@6b887d9954eb656141597eac077ca22053a525ef,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@b939522701b527096e5d028346e777714466bcc5,QuantStrategyLab/QuantPlatformKit/.github/workflows/reusable-drift-check.yml@8b8ce3543c04bf12920e38b0f45d2b32a8896580
          CODEX_AUDIT_SERVICE_ALLOWED_DIRECT_REPOSITORIES: QuantStrategyLab/AIAuditBridge
          CODEX_AUDIT_SERVICE_ALLOWED_SOURCE_REPOSITORIES: QuantStrategyLab/AIAuditBridge,QuantStrategyLab/BinancePlatform,QuantStrategyLab/CharlesSchwabPlatform,QuantStrategyLab/CnEquitySnapshotPipelines,QuantStrategyLab/CnEquityStrategies,QuantStrategyLab/CryptoLivePoolPipelines,QuantStrategyLab/CryptoStrategies,QuantStrategyLab/FirstradePlatform,QuantStrategyLab/HkEquitySnapshotPipelines,QuantStrategyLab/HkEquityStrategies,QuantStrategyLab/IBKRGatewayManager,QuantStrategyLab/InteractiveBrokersPlatform,QuantStrategyLab/LongBridgePlatform,QuantStrategyLab/MarketSignalSources,QuantStrategyLab/PoliticalEventTrackingResearch,QuantStrategyLab/QmtPlatform,QuantStrategyLab/QuantAdvisorResearch,QuantStrategyLab/QuantPlatformKit,QuantStrategyLab/QuantRuntimeSettings,QuantStrategyLab/QuantStrategyPlugins,QuantStrategyLab/ResearchSignalContextPipelines,QuantStrategyLab/SchwabTokenAutoRefresher,QuantStrategyLab/UsEquitySnapshotPipelines,QuantStrategyLab/UsEquityStrategies
          CODEX_AUDIT_SERVICE_MODEL: ${{ vars.CODEX_AUDIT_SERVICE_MODEL }}
          CODEX_AUDIT_SERVICE_REASONING_EFFORT: ${{ vars.CODEX_AUDIT_SERVICE_REASONING_EFFORT }}
          CODEX_AUDIT_SERVICE_CODEX_ACCOUNT_USAGE: "1"
          CODEX_AUDIT_SERVICE_OPENAI_USAGE_WINDOW_DAYS: "7"
          CODEX_AUDIT_SERVICE_ANTHROPIC_USAGE_WINDOW_DAYS: "7"
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          CODEX_AUDIT_SERVICE_TOKEN: ${{ secrets.CODEX_AUDIT_SERVICE_TOKEN }}
        run: bash scripts/deploy_codex_audit_service.sh "${{ inputs.mode }}"

  org-health-token:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'install-org-health-token'
    environment: codex-vps-ops
    runs-on:
      - self-hosted
      - codex-vps
    timeout-minutes: 15
    steps:
      - name: Verify idle host and stop Codex service
        run: |
          set -euo pipefail
          service=codex-audit-service
          nnp="$(systemctl show "$service" --property=NoNewPrivileges --value 2>/dev/null || true)"
          case "$nnp" in
            yes|true) ;;
            *) echo "org-health token install requires NoNewPrivileges=yes" >&2; exit 1 ;;
          esac
          sudo -n python3 - <<'PY'
          import json
          from pathlib import Path
          job_dir = Path("/var/lib/codex-audit-bridge/jobs")
          active = 0
          if job_dir.exists():
              for path in job_dir.glob("*.json"):
                  try:
                      payload = json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      raise SystemExit("cannot verify active jobs") from exc
                  if payload.get("status") in {"queued", "running"}:
                      active += 1
          if active:
              raise SystemExit("active Codex jobs present; refusing service stop")
          print("active_jobs=0")
          PY
          if systemctl is-active --quiet "$service"; then
            sudo -n systemctl stop "$service"
          fi
          if systemctl is-active --quiet "$service"; then
            echo "codex service did not stop; refusing secret installation" >&2
            exit 1
          fi
          echo "codex_service_idle=1"

      - name: Stage immutable payload from this commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "immutable commit is required" >&2; exit 1; }
          stage="/run/codex-org-health-provision/${GITHUB_RUN_ID}"
          sudo -n install -d -o root -g root -m 0700 "$stage"
          fetch() {
            local source="$1" target="$2" mode="$3"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              "https://raw.githubusercontent.com/QuantStrategyLab/AIAuditBridge/${GITHUB_SHA}/${source}" \
              | sudo -n tee "$stage/$target" >/dev/null
            sudo -n chown root:root "$stage/$target"
            sudo -n chmod "$mode" "$stage/$target"
          }
          fetch scripts/provision_org_health_github_app.sh provision_org_health_github_app.sh 0755
          fetch scripts/refresh_org_health_github_token.py refresh_org_health_github_token.py 0755
          fetch service/org_health.py org_health.py 0644
          fetch ops/codex-audit/systemd/codex-org-health-refresh.service.example codex-org-health-refresh.service 0644
          fetch ops/codex-audit/systemd/codex-org-health-refresh.timer.example codex-org-health-refresh.timer 0644
          sudo -n chmod 0755 "$stage"

      - name: Install root-only issuer and token wiring
        env:
          APP_ID: ${{ vars.CROSS_REPO_GITHUB_APP_ID }}
          INSTALLATION_ID: "120834787"
          APP_PRIVATE_KEY: ${{ secrets.CROSS_REPO_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          stage="/run/codex-org-health-provision/${GITHUB_RUN_ID}"
          [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ] || { echo "GitHub App configuration is missing" >&2; exit 1; }
          printf '%s' "$APP_PRIVATE_KEY" | sudo -n /bin/bash "$stage/provision_org_health_github_app.sh" \
            --app-id "$APP_ID" \
            --installation-id "$INSTALLATION_ID" \
            --service-name codex-audit-service \
            --deploy-dir /opt/codex-audit-bridge \
            --payload-dir "$stage" \
            --private-key-stdin
          unset APP_PRIVATE_KEY

      - name: Mint and validate first installation token
        run: |
          set -euo pipefail
          sudo -n systemctl start codex-org-health-refresh.service
          sudo -n python3 - <<'PY'
          import json
          import os
          import stat
          import time
          from datetime import datetime
          path = "/run/codex-org-health/installation-token.json"
          info = os.stat(path)
          if info.st_uid != 0 or info.st_mode & 0o022 or stat.S_ISLNK(info.st_mode):
              raise SystemExit("token file ownership or mode is unsafe")
          payload = json.load(open(path, encoding="utf-8"))
          if not isinstance(payload.get("token"), str) or not payload["token"]:
              raise SystemExit("token file is missing token")
          expiry = datetime.fromisoformat(str(payload["expires_at"]).replace("Z", "+00:00")).timestamp()
          if expiry <= time.time() + 60:
              raise SystemExit("token file is already expired")
          print("org_health_token=valid")
          PY

      - name: Enable token refresh timer after validation
        run: |
          set -euo pipefail
          sudo -n systemctl enable codex-org-health-refresh.service >/dev/null
          sudo -n systemctl enable codex-org-health-refresh.timer >/dev/null
          sudo -n systemctl start codex-org-health-refresh.timer

      - name: Remove root staging payload
        if: always()
        run: sudo -n rm -rf "/run/codex-org-health-provision/${GITHUB_RUN_ID}"
