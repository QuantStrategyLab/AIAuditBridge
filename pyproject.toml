[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway-client"
version = "0.1.0"
description = "Internal client for the QuantStrategyLab AI gateway"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
build-development-research-review = "build_development_research_review:main"

[tool.setuptools]
packages = ["ai_gateway_client"]
py-modules = ["service.development_research_review", "build_development_research_review"]
package-dir = {ai_gateway_client = "client", service = "service", "" = "scripts"}
include-package-data = false
