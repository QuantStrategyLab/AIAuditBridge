[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-ai-service"
version = "2.0.0"
description = "Quant project identity policies for the shared AI task service"
requires-python = ">=3.10"
dependencies = ["personal-ai-service==2.0.0"]

[project.scripts]
quant-ai-service = "quant_ai_service.server:main"

[tool.setuptools.packages.find]
where = ["src"]
