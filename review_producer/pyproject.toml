[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "aab-development-review-producer"
version = "0.1.0"
description = "Fixed local development-review producer for QuantStrategyLab D1"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
build-development-research-review = "build_development_research_review:main"

[tool.setuptools]
packages = ["service"]
py-modules = ["build_development_research_review"]
include-package-data = false
